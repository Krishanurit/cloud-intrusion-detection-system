<!DOCTYPE html>
<html>

<head>

<title>Cloud Intrusion Detection System</title>

<style>

body{
    font-family:Arial;
    background:#f4f6f9;
}

.container{
    width:60%;
    margin:auto;
    margin-top:50px;
    background:white;
    padding:30px;
    border-radius:10px;
    box-shadow:0px 0px 15px lightgray;
}

h1{
    color:#0d6efd;
    text-align:center;
}

p{
    text-align:center;
}

button{

    background:#0d6efd;
    color:white;
    border:none;
    padding:15px 30px;
    font-size:18px;
    cursor:pointer;
    border-radius:5px;

}

button:hover{

    background:#084298;

}

.center{

text-align:center;

margin-top:30px;

}

.result{

margin-top:30px;
padding:20px;
font-size:22px;
font-weight:bold;
background:#d1e7dd;
border-radius:8px;
text-align:center;

}

</style>

</head>

<body>

<div class="container">

<h1>Cloud Intrusion Detection System</h1>

<p>
Click the button below to analyse a sample from the NSL-KDD dataset.
</p>

<div class="center">

<a href="/predict">

<button>

Run Detection

</button>

</a>

</div>

{% if prediction %}

<div class="result">

{{ prediction }}

</div>

{% endif %}

</div>

</body>

</html>
